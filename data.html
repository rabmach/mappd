<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mappd — data table</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--fg:#c8c8c8;--dim:#555;--red:#c0392b;--orange:#d35400;--yellow:#f39c12;--blue:#2980b9;--green:#27ae60;--surface:#141414;--border:#222}
body{background:var(--bg);color:var(--fg);font-family:'SF Mono','Fira Code','Cascadia Code',monospace;font-size:12px;line-height:1.5}
header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:14px;font-weight:600;white-space:nowrap}
header h1 span{color:var(--red)}
header a{color:var(--blue);text-decoration:none;font-size:12px}
header a:hover{text-decoration:underline}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--border)}
.controls label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.controls select,.controls input{background:var(--surface);border:1px solid var(--border);color:var(--fg);padding:4px 8px;font-family:inherit;font-size:11px;border-radius:2px;outline:none}
.controls select:focus,.controls input:focus{border-color:#444}
#count{font-size:11px;color:var(--dim);margin-left:auto}
table{width:100%;border-collapse:collapse}
thead{position:sticky;top:0;z-index:10}
th{background:var(--surface);border-bottom:2px solid var(--border);padding:8px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--fg)}
th .sort-arrow{margin-left:4px;font-size:8px}
th.sorted{color:var(--fg)}
td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:hover td{background:#1a1a1a}
tr.data-row{cursor:pointer}
.tag{font-size:9px;padding:1px 4px;border-radius:2px;display:inline-block;margin:1px 2px;white-space:nowrap}
.sev-extreme{color:#c0392b;font-weight:700}
.sev-severe{color:#d35400;font-weight:600}
.sev-moderate{color:#f39c12}
.rev-badge{background:#0a3a1a;color:#2ecc71;padding:1px 5px;border-radius:2px;font-size:9px;font-weight:600}
.reason-cell{max-width:400px;font-size:11px;color:var(--dim);line-height:1.4}
.reason-cell strong{color:var(--fg)}
.stats-cell{font-size:10px;color:var(--dim);max-width:300px}
.stats-cell .stat{display:inline-block;margin-right:8px}
.stats-cell .stat b{color:var(--fg)}
footer{padding:10px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--dim);text-align:center}
@media(max-width:768px){
  table{font-size:10px}
  th,td{padding:4px 6px}
  .reason-cell{max-width:200px}
}
</style>
</head>
<body>
<header>
<h1><span>mappd</span> — data table</h1>
<a href="index.html">&larr; back to map</a>
<a href="literacy.html">literacy deep-dive &rarr;</a>
</header>
<div class="controls">
<label>filter by tag:</label>
<select id="tag-filter"><option value="all">All tags</option></select>
<label>search:</label>
<input type="text" id="search" placeholder="search..." style="width:200px"/>
<span id="count"></span>
</div>
<table>
<thead><tr>
<th data-col="name">Name <span class="sort-arrow"></span></th>
<th data-col="state">State <span class="sort-arrow"></span></th>
<th data-col="severity">Severity <span class="sort-arrow"></span></th>
<th data-col="tags">Tags <span class="sort-arrow"></span></th>
<th data-col="reason">Reason <span class="sort-arrow"></span></th>
<th data-col="reversal">Reversal <span class="sort-arrow"></span></th>
<th data-col="stats">Key Stats <span class="sort-arrow"></span></th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>
<footer>mappd — a map of where not to live in america, and who's turning it around. data sourced from EPA, CDC, NCES, PIAAC, Census, GAO, UNC Sheps Center, and local reporting.</footer>

<script src="places-data.js"></script>
<script>
// Dedup
const seen=new Set();
const places=PLACES.filter(p=>{const k=(p.name+p.state).toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});

// Populate filter dropdown
const tagFilter=document.getElementById('tag-filter');
const allTags=new Set();
places.forEach(p=>p.tags.forEach(t=>allTags.add(t)));
[...allTags].sort().forEach(t=>{
  const c=TAG_COLORS[t]||{label:t};
  const opt=document.createElement('option');
  opt.value=t;opt.textContent=c.label||t;
  tagFilter.appendChild(opt);
});

// Render table
const tbody=document.getElementById('tbody');
let sortCol='severity';let sortAsc=true;

function renderTable(){
  const filterTag=tagFilter.value;
  const searchQ=document.getElementById('search').value.trim().toLowerCase();
  let filtered=places.filter(p=>{
    if(filterTag!=='all'&&!p.tags.includes(filterTag))return false;
    if(searchQ){
      const hay=(p.name+' '+p.state+' '+p.tags.join(' ')+' '+(p.reason||'')+' '+(p.reversal||'')).toLowerCase();
      if(!hay.includes(searchQ))return false;
    }
    return true;
  });
  filtered.sort((a,b)=>{
    let va,vb;
    if(sortCol==='name'){va=a.name;vb=b.name}
    else if(sortCol==='state'){va=a.state;vb=b.state}
    else if(sortCol==='severity'){va=SEV[a.severity]??3;vb=SEV[b.severity]??3}
    else if(sortCol==='tags'){va=a.tags.join(' ');vb=b.tags.join(' ')}
    else if(sortCol==='reason'){va=a.reason||'';vb=b.reason||''}
    else if(sortCol==='reversal'){va=a.reversal?'1':'0';vb=b.reversal?'1':'0'}
    else if(sortCol==='stats'){va=JSON.stringify(a.stats||{});vb=JSON.stringify(b.stats||{})}
    else{va='';vb=''}
    if(typeof va==='string')return sortAsc?va.localeCompare(vb):vb.localeCompare(va);
    return sortAsc?va-vb:vb-va;
  });
  document.getElementById('count').textContent=`${filtered.length} of ${places.length} places`;
  tbody.innerHTML=filtered.map(p=>{
    const sevClass=p.severity==='extreme'?'sev-extreme':p.severity==='severe'?'sev-severe':'sev-moderate';
    const tagsHtml=p.tags.filter(t=>t!=='reversal').map(t=>{
      const c=TAG_COLORS[t]||{bg:'#333',fg:'#ccc',label:t};
      const tagToCat={"water-contam":"water","water-scarce":"water","water-infra":"water","water":"water","pfas":"pollution","toxic":"pollution","fracking":"pollution","cancer":"pollution","industrial":"pollution","ozone":"pollution","env":"pollution","air":"pollution","food":"pollution","seismic":"pollution","poor":"society","mental-health":"society","medicaid":"society","brain-drain":"society","decline":"society","economic":"society","rural":"society","educ":"education","literacy":"education","school-closure":"education","infra":"infrastructure","lead":"infrastructure","policy-cut":"governance","governance":"governance","heat":"climate","flood":"climate","flooding":"climate","hurricane":"climate","farm":"climate","improving":"reversal","future":"reversal","reversal":"reversal"};
      const cat=tagToCat[t]||'all';
      return `<a class="tag" style="background:${c.bg};color:${c.fg};text-decoration:none;cursor:pointer" href="index.html?cat=${cat}&sub=${t}">${c.label}</a>`;
    }).join('');
    const revHtml=p.reversal?'<span class="rev-badge">REVERSING</span>':'';
    const reasonShort=(p.reason||'').replace(/<[^>]+>/g,'').substring(0,200);
    const statsHtml=p.stats?Object.entries(p.stats).slice(0,4).map(([k,v])=>`<span class="stat"><b>${k.replace(/_/g,' ')}:</b> ${v}</span>`).join(''):'';
    return `<tr class="data-row" onclick="window.location='index.html#place=${encodeURIComponent(p.name)}'">
      <td><strong>${p.name}</strong></td>
      <td>${p.state}</td>
      <td class="${sevClass}">${p.severity.toUpperCase()}</td>
      <td>${tagsHtml}${revHtml}</td>
      <td class="reason-cell">${reasonShort}${reasonShort.length>=200?'...':''}</td>
      <td>${p.reversal?'<span class="rev-badge">YES</span>':''}</td>
      <td class="stats-cell">${statsHtml}</td>
    </tr>`;
  }).join('');
}

// Sort
document.querySelectorAll('th[data-col]').forEach(th=>{
  th.addEventListener('click',()=>{
    const col=th.dataset.col;
    if(sortCol===col)sortAsc=!sortAsc;else{sortCol=col;sortAsc=true}
    document.querySelectorAll('th').forEach(t=>{t.classList.remove('sorted');t.querySelector('.sort-arrow').textContent=''});
    th.classList.add('sorted');
    th.querySelector('.sort-arrow').textContent=sortAsc?'▲':'▼';
    renderTable();
  });
});

tagFilter.addEventListener('change',renderTable);
document.getElementById('search').addEventListener('input',renderTable);

// Initial render
document.querySelector('th[data-col="severity"]').classList.add('sorted');
document.querySelector('th[data-col="severity"] .sort-arrow').textContent='▲';
renderTable();
</script>
</body>
</html>
