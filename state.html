<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mappd — state detail</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--fg:#c8c8c8;--dim:#555;--red:#c0392b;--orange:#d35400;--yellow:#f39c12;--blue:#2980b9;--green:#27ae60;--surface:#141414;--border:#222}
body{background:var(--bg);color:var(--fg);font-family:'SF Mono','Fira Code','Cascadia Code',monospace;font-size:13px;line-height:1.6}
header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:15px;font-weight:600}
header h1 span{color:var(--red)}
header a{color:var(--blue);text-decoration:none;font-size:12px}
header a:hover{text-decoration:underline}
.hero{padding:24px 16px;border-bottom:1px solid var(--border);max-width:1000px}
.hero h2{font-size:18px;color:var(--fg);margin-bottom:8px}
.hero .big-stat{font-size:48px;font-weight:700;line-height:1}
.hero .stat-desc{font-size:12px;color:var(--dim);margin-top:4px}
.hero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:16px}
.hero-card{background:var(--surface);border:1px solid var(--border);padding:12px;border-radius:3px}
.hero-card .num{font-size:24px;font-weight:700;color:var(--fg)}
.hero-card .label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.content{max-width:1200px;padding:16px}
section{margin-bottom:24px}
section h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:6px}
.place-card{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:14px;margin-bottom:10px;display:flex;gap:14px;align-items:start}
.place-card .marker{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.place-card .body{flex:1;min-width:0}
.place-card .title{font-weight:700;font-size:13px;margin-bottom:4px}
.place-card .title a{color:var(--fg);text-decoration:none}
.place-card .title a:hover{color:var(--blue)}
.place-card .tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.place-card .reason{font-size:11px;color:var(--dim);line-height:1.5}
.place-card .reason strong{color:var(--fg)}
.place-card .what-changed{border-left:3px solid #4fc3f7;padding-left:8px;margin-top:8px;font-size:11px;color:var(--dim);line-height:1.5}
.place-card .what-changed.good{border-left-color:#2ecc71}
.tag{font-size:9px;padding:1px 4px;border-radius:2px;display:inline-block}
.sev-extreme{color:#c0392b;font-weight:700}
.sev-severe{color:#d35400;font-weight:600}
.sev-moderate{color:#f39c12}
footer{padding:10px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--dim);text-align:center;margin-top:24px}
.nf{padding:24px 16px;text-align:center;color:var(--dim)}
.nf h2{font-size:16px;color:var(--fg);margin-bottom:8px}
</style>
</head>
<body>
<header>
<h1><span>mappd</span> — <span id="state-title">...</span></h1>
<a href="index.html">&larr; back to map</a>
<a href="literacy.html">literacy overview &rarr;</a>
<a href="data.html">data table &rarr;</a>
</header>

<div class="hero" id="hero-section"></div>
<div class="content" id="places-section"></div>
<footer>mappd — data sourced from EPA, CDC, NCES, PIAAC, Census, GAO, UNC Sheps Center, and local reporting.</footer>

<script src="places-data.js"></script>
<script>
const STATES=[
["NH","New Hampshire",278.9,11.5],["MN","Minnesota",278.8,12.0],["VT","Vermont",276.7,12.5],["DC","Washington DC",276.7,11.0],["AK","Alaska",276.7,13.0],["ND","North Dakota",276.0,12.8],["WA","Washington",275.0,14.0],["UT","Utah",274.0,14.5],["IA","Iowa",273.0,15.0],["OR","Oregon",273.0,15.5],["ME","Maine",273.0,13.5],["WI","Wisconsin",273.0,14.2],["MA","Massachusetts",273.0,13.8],["MT","Montana",273.0,14.0],["WY","Wyoming",272.0,14.5],["CO","Colorado",272.0,14.8],["NE","Nebraska",271.0,15.2],["CT","Connecticut",271.0,14.0],["KS","Kansas",271.0,15.5],["SD","South Dakota",271.0,15.0],["MI","Michigan",271.0,15.5],["HI","Hawaii",270.0,16.0],["VA","Virginia",270.0,15.8],["ID","Idaho",270.0,16.0],["OH","Ohio",268.0,17.0],["MD","Maryland",268.0,16.5],["IN","Indiana",266.0,18.0],["PA","Pennsylvania",266.0,17.5],["RI","Rhode Island",266.0,17.0],["MO","Missouri",266.0,18.5],["IL","Illinois",266.0,18.2],["NC","North Carolina",265.0,19.0],["NJ","New Jersey",264.0,18.5],["DE","Delaware",264.0,18.0],["OK","Oklahoma",263.0,19.5],["SC","South Carolina",263.0,20.0],["AZ","Arizona",262.0,20.5],["KY","Kentucky",261.0,21.0],["GA","Georgia",260.0,21.5],["TN","Tennessee",260.0,21.0],["WV","West Virginia",260.0,22.0],["NY","New York",260.0,19.5],["FL","Florida",259.0,20.5],["AL","Alabama",259.0,21.0],["AR","Arkansas",259.0,21.5],["CA","California",257.0,28.4],["NV","Nevada",255.0,22.0],["TX","Texas",254.0,28.2],["MS","Mississippi",252.0,28.0],["NM","New Mexico",252.0,29.1],["LA","Louisiana",252.0,27.1]
];

const params=new URLSearchParams(window.location.search);
const st=(params.get('st')||'').toUpperCase();
const stateData=STATES.find(s=>s[0]===st);

if(!stateData){
  document.getElementById('hero-section').innerHTML='<div class="nf"><h2>State not found</h2><p>No data for "'+st+'". <a href="literacy.html" style="color:var(--blue)">Back to literacy overview.</a></p></div>';
  document.getElementById('places-section').innerHTML='';
}else{
  const [abbr,name,score,lvl]=stateData;

  // National ranking
  const ranked=[...STATES].sort((a,b)=>b[2]-a[2]);
  const rank=ranked.findIndex(s=>s[0]===abbr)+1;

  // Score color
  function scoreColor(s){
    if(s>=270)return'#1b5e20';
    if(s>=265)return'#388e3c';
    if(s>=260)return'#689f38';
    if(s>=255)return'#f57f17';
    return'#d32f2f';
  }

  document.title='mappd — '+name;
  document.getElementById('state-title').textContent=name;

  const color=scoreColor(score);
  const natAvg=263.5;
  const diff=(score-natAvg).toFixed(1);
  const diffStr=diff>0?'+'+diff:diff;
  const diffColor=score>=natAvg?'var(--green)':'var(--red)';

  // Low literacy estimate (national avg ~28% at Level 1 or below; scale by score)
  const lowLitPct=lvl;

  document.getElementById('hero-section').innerHTML=`
    <h2>${name} — Literacy & Place Data</h2>
    <div class="hero-grid">
      <div class="hero-card"><div class="num" style="color:${color}">${score}</div><div class="label">PIAAC Score (national avg: ${natAvg})</div></div>
      <div class="hero-card"><div class="num">#${rank}<span style="font-size:14px;color:var(--dim)"> / 51</span></div><div class="label">National Rank</div></div>
      <div class="hero-card"><div class="num" style="color:${diffColor}">${diffStr}</div><div class="label">Points vs National Average</div></div>
      <div class="hero-card"><div class="num" style="color:${lowLitPct>20?'var(--red)':'var(--fg)'}">${lowLitPct}%</div><div class="label">Adults at Low Literacy (Level 1 or below)</div></div>
    </div>
    <p style="font-size:11px;color:var(--dim);margin-top:12px">Source: PIAAC Skills Map (nces.gov/surveys/piaac/scoresmap/), NCES, OECD. Scale: 0-500. Below 255 = "low literacy desert."</p>
  `;

  // Places in this state
  const seen=new Set();
  const statePlaces=PLACES.filter(p=>{
    if(p.state!==abbr)return false;
    const k=(p.name+p.state).toLowerCase();
    if(seen.has(k))return false;
    seen.add(k);return true;
  });

  const placesHtml=statePlaces.length?statePlaces.map(p=>{
    const sevColor=SEV[p.severity]||'#666';
    const sevClass=p.severity==='extreme'?'sev-extreme':p.severity==='severe'?'sev-severe':'sev-moderate';
    const tagsHtml=p.tags.filter(t=>t!=='reversal').map(t=>{
      const c=TAG_COLORS[t]||{bg:'#333',fg:'#ccc',label:t};
      return `<span class="tag" style="background:${c.bg};color:${c.fg}">${c.label}</span>`;
    }).join('');
    const revBadge=p.reversal?'<span class="tag" style="background:#0a3a1a;color:#2ecc71">Reversing</span>':'';
    const wcHtml=p.what_changed?
      `<div class="what-changed${p.tags&&(p.tags.includes('future')||p.tags.includes('reversal')||p.tags.includes('improving'))?' good':''}">${p.what_changed}</div>`:'';

    return `<div class="place-card">
      <div class="marker" style="background:${p.tags&&p.tags.includes('future')?'#4fc3f7':p.tags&&(p.tags.includes('reversal')||p.tags.includes('improving'))?'#2ecc71':sevColor}"></div>
      <div class="body">
        <div class="title"><a href="index.html#place=${encodeURIComponent(p.name)}">${p.name}, ${p.state}</a> <span class="${sevClass}" style="font-size:10px;margin-left:6px">${p.severity.toUpperCase()}</span></div>
        <div class="tags">${tagsHtml}${revBadge}</div>
        <div class="reason">${(p.reason||'').replace(/<[^>]+>/g,'').substring(0,300)}${(p.reason||'').length>300?'...':''}</div>
        ${wcHtml}
      </div>
    </div>`;
  }).join(''):'<div class="nf"><h2>No flagged places in '+name+'</h2><p>This state has no entries in the mappd dataset yet.</p></div>';

  document.getElementById('places-section').innerHTML=`
    <section>
      <h3>Flagged Places in ${name} (${statePlaces.length})</h3>
      ${placesHtml}
    </section>
  `;
}
</script>
</body>
</html>
